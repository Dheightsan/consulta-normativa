<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta normativa</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  p.sub { color: #555; margin-top: 0; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #aaa; border-radius: 4px; }
  button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: 4px; background: #1f4e8c; color: #fff; cursor: pointer; }
  #out { margin-top: 1.5rem; }
  .resp { font-size: 1.05rem; line-height: 1.5; }
  .no { color: #8a4b00; }
  .cita { border-left: 3px solid #1f4e8c; padding: .1rem .8rem; margin: .8rem 0; background: #f4f6f9; }
  .cita b { display: block; margin-bottom: .2rem; }
  small { color: #666; }
</style>
</head>
<body>
<h1>Consulta normativa</h1>
<p class="sub">Ley 20.285 (Transparencia), Ley 19.880 (Procedimiento Administrativo) y Ley 19.886 (Compras Públicas).</p>
<form id="f">
  <input id="q" maxlength="500" placeholder="Ej: ¿En cuántos días hábiles debe responder un servicio una solicitud de acceso a información?" required>
  <button>Preguntar</button>
</form>
<div id="out"></div>
<script>
const out = document.getElementById("out");
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  out.replaceChildren(el("p", "", "Buscando..."));
  try {
    const r = await fetch("/preguntar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pregunta: document.getElementById("q").value }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const nodes = [el("p", "resp" + (d.fundamentada ? "" : " no"), d.respuesta)];
    for (const c of d.citas) {
      const box = el("div", "cita");
      box.append(el("b", "", "Ley " + c.ley + ", art. " + c.articulo), el("span", "", c.extracto));
      nodes.push(box);
    }
    nodes.push(el("small", "", "Modo: " + d.modo));
    out.replaceChildren(...nodes);
  } catch (e) {
    out.replaceChildren(el("p", "no", "Error al consultar: " + e.message));
  }
});
</script>
</body>
</html>
